<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Filmliste">
<title>Filmliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0d; --bg2:#141417; --card:#1c1c21; --line:#2a2a31;
  --text:#f4f4f5; --muted:#a1a1aa; --dim:#71717a;
  --accent:#e11d2e; --accent2:#ff4655; --rent:#fbbf24;
  --pad:clamp(16px,4vw,56px);
  --cardw:clamp(118px,30vw,188px);
  --hdr:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
img{display:block}

/* ---------- header: logo, tjenester, søg ---------- */
header{position:fixed;inset:0 0 auto 0;z-index:40;display:flex;align-items:center;gap:22px;
  padding:calc(12px + env(safe-area-inset-top)) var(--pad) 12px;
  background:linear-gradient(180deg,rgba(11,11,13,.95) 0%,rgba(11,11,13,.6) 70%,transparent 100%);transition:background .25s}
header.solid{background:rgba(11,11,13,.97);box-shadow:0 1px 0 var(--line)}
.logo{flex:none;font-family:'Bebas Neue',Impact,sans-serif;font-size:32px;letter-spacing:1.5px;color:var(--accent);line-height:1;cursor:pointer;user-select:none}
.logo span{color:var(--text)}
nav.tabs{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;mask-image:linear-gradient(90deg,#000 92%,transparent)}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-size:14px;font-weight:600;color:#d4d4d8;white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{color:#fff;background:rgba(255,255,255,.08)}
.tab.on{background:var(--text);color:#000}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--c,#888)}
.search{flex:none;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  border-radius:999px;padding:7px 12px;width:min(240px,32vw);transition:border-color .2s,background .2s}
.search:focus-within{border-color:rgba(255,255,255,.4);background:rgba(0,0,0,.6)}
.search input{background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:14px;width:100%;min-width:0}
.search input::-webkit-search-cancel-button{filter:invert(1)}
.search svg{flex:none;opacity:.7}
@media (max-width:760px){
  :root{--hdr:108px}
  header{flex-wrap:wrap;gap:10px 12px;padding-bottom:10px}
  .logo{font-size:28px}
  .search{flex:1;width:auto}
  nav.tabs{order:3;flex:1 0 100%;margin:0 calc(var(--pad) * -1);padding:0 var(--pad)}
}

/* ---------- hero ---------- */
.hero{position:relative;min-height:min(78vh,640px);display:flex;align-items:flex-end;overflow:hidden;
  padding:calc(var(--hdr) + 30px + env(safe-area-inset-top)) var(--pad) 40px}
.hero-bg{position:absolute;inset:-40px;background-size:cover;background-position:center 25%;filter:blur(28px) saturate(1.3) brightness(.55);transform:scale(1.1)}
.hero::after{content:"";position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(11,11,13,.95) 0%,rgba(11,11,13,.6) 45%,rgba(11,11,13,.15) 100%),
  linear-gradient(0deg,var(--bg) 0%,transparent 40%)}
.hero-inner{position:relative;z-index:2;display:flex;gap:clamp(18px,4vw,48px);align-items:flex-end;width:100%}
.hero-poster{width:clamp(120px,20vw,250px);aspect-ratio:2/3;border-radius:10px;overflow:hidden;flex:none;
  box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);background:var(--card)}
.hero-poster .poster{height:100%;border-radius:0}
.hero-text{max-width:620px;min-width:0}
.kicker{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent2);margin-bottom:10px}
.hero h1{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:clamp(40px,7vw,84px);line-height:.92;letter-spacing:.5px;margin-bottom:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;color:var(--muted);font-size:14px;margin-bottom:12px}
.meta .dot{width:3px;height:3px;border-radius:50%;background:var(--dim)}
.hero p.note{font-size:clamp(14px,1.6vw,17px);line-height:1.5;color:#d4d4d8;margin-bottom:18px;max-width:560px}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:6px;font-weight:700;font-size:15px;text-decoration:none}
.btn.ghost{background:rgba(109,109,110,.55);color:#fff}
.btn.ghost:hover{background:rgba(109,109,110,.35)}

/* ---------- badges ---------- */
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;font-size:13px;font-weight:600;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);white-space:nowrap}
.badge i{width:9px;height:9px;border-radius:50%;background:var(--c,#888);box-shadow:0 0 0 2px rgba(0,0,0,.3)}
.badge.rent{color:var(--rent)}

/* ---------- rows ---------- */
.genrebar{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top) - 4px);z-index:30;padding:8px 0 12px;margin-bottom:6px;background:linear-gradient(var(--bg) 75%,rgba(11,11,13,0))}
.genrebar .chips{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:2px var(--pad);scrollbar-width:none}
.genrebar .chips::-webkit-scrollbar{display:none}
.genrebar .lbl{flex:none;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);font-weight:700;margin-right:2px}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--bg2);color:#d4d4d8;transition:all .15s}
.chip:hover{border-color:#52525b;color:#fff}
.chip.on{background:var(--text);color:#000;border-color:var(--text)}
.chip .n{font-size:12px;opacity:.55;font-weight:500}
.section-title{padding:18px var(--pad) 4px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);font-weight:700}
.row{margin:8px 0 30px}
.row-head{display:flex;align-items:baseline;gap:12px;padding:0 var(--pad);margin-bottom:10px}
.row-head h2{font-size:clamp(17px,2vw,21px);font-weight:700;display:flex;align-items:center;gap:10px}
.row-head h2 i{width:12px;height:12px;border-radius:3px;background:var(--c,#888)}
.row-head .count{color:var(--dim);font-size:13px}
.row-head .more{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600}
.row-head .more:hover{color:#fff}
.track-wrap{position:relative}
.track{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px var(--pad) 14px;scroll-padding:0 var(--pad);scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.arrow{position:absolute;top:6px;bottom:60px;width:calc(var(--pad) - 6px);min-width:36px;z-index:5;display:grid;place-items:center;
  background:rgba(11,11,13,.6);opacity:0;transition:opacity .2s;font-size:28px}
.track-wrap:hover .arrow{opacity:1}
.arrow.l{left:0}.arrow.r{right:0}
.arrow:hover{background:rgba(11,11,13,.85)}
@media (hover:none){.arrow{display:none}}

/* ---------- cards ---------- */
.card{flex:none;width:var(--cardw);scroll-snap-align:start;text-align:left;position:relative}
.poster{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--card);isolation:isolate;
  box-shadow:0 0 0 1px rgba(255,255,255,.06);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.card:hover .poster,.card:focus-visible .poster{transform:scale(1.05);box-shadow:0 18px 40px rgba(0,0,0,.7),0 0 0 2px rgba(255,255,255,.7)}
.card:focus-visible{outline:none}
.poster .fallback{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 10px 36px;overflow:hidden;
  background:linear-gradient(160deg,var(--g1,#3f3f46),var(--g2,#18181b))}
.poster .fallback b{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:clamp(19px,5.2vw,26px);line-height:.95;letter-spacing:.5px;overflow-wrap:anywhere}
.poster .fallback small{color:rgba(255,255,255,.7);font-size:12px;margin-top:4px}
.poster img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.poster img.ok{opacity:1}
.poster .svc{position:absolute;z-index:2;left:6px;bottom:6px;right:6px;display:flex;flex-wrap:nowrap;gap:4px;overflow:hidden}
.poster .svc span{flex:none;white-space:nowrap;font-size:10px;font-weight:700;padding:3px 6px;border-radius:4px;background:var(--c);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.5);text-shadow:0 1px 1px rgba(0,0,0,.3)}
.poster .svc span.more{background:rgba(0,0,0,.75)}
.poster .svc span.rent{background:rgba(0,0,0,.8);color:var(--rent)}
.card .t{margin-top:8px;font-size:13.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .y{font-size:12px;color:var(--dim);margin-top:2px}
.card .price{font-size:12.5px;font-weight:700;color:var(--rent);margin-top:3px}

/* ---------- grid ---------- */
.grid-wrap{padding:0 var(--pad)}
.grid-wrap:first-child{padding-top:calc(var(--hdr) + 22px + env(safe-area-inset-top))}
.grid-title{display:flex;align-items:center;gap:12px;margin:6px 0 8px}
.grid-title h2{font-size:clamp(22px,3vw,30px);font-weight:800;display:flex;align-items:center;gap:12px}
.grid-title h2 i{width:16px;height:16px;border-radius:4px;background:var(--c,#888)}
.grid-title .count{color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cardw),1fr));gap:22px 12px}
.grid .card{width:auto}
.empty{color:var(--muted);padding:40px var(--pad);text-align:center;line-height:1.6}
.empty b{color:#fff}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);display:none;overflow-y:auto;padding:max(24px,env(safe-area-inset-top)) 12px 24px}
.overlay.open{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{position:relative;max-width:820px;margin:4vh auto;background:var(--bg2);border-radius:14px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.8);animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.m-top{position:relative;padding:28px;display:flex;gap:24px;align-items:flex-end;min-height:280px;overflow:hidden}
.m-top .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(26px) brightness(.45) saturate(1.3)}
.m-top::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg2),transparent 60%)}
.m-top>*:not(.bg){position:relative;z-index:2}
.m-poster{width:170px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;flex:none;box-shadow:0 20px 40px rgba(0,0,0,.6);background:var(--card)}
.m-poster .poster{border-radius:0;height:100%}
.m-title h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:clamp(34px,5vw,54px);line-height:.95;margin-bottom:8px}
.m-title .orig{color:var(--muted);font-size:14px;margin-bottom:8px}
.close{position:absolute;top:12px;right:12px;z-index:5;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;font-size:20px}
.close:hover{background:rgba(0,0,0,.9)}
.m-body{padding:4px 28px 28px;display:grid;gap:22px}
.m-body p{line-height:1.6;color:#d4d4d8}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#26262c;color:#d4d4d8}
.tag:hover{background:#33333b}
.offer h3{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:8px;font-weight:700}
.offer .none{color:var(--muted);font-size:14px}
.prices{display:grid;gap:6px;max-width:420px}
.prices div{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;background:#1c1c21;font-size:14px;font-weight:600}
.prices div i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.prices div b{margin-left:auto;font-weight:700;color:#fff}
.prices div.best{background:color-mix(in srgb,var(--rent) 14%,#1c1c21);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rent) 45%,transparent)}
.prices div.best b{color:var(--rent)}
.prices small{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--rent)}
.m-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px;color:var(--dim);font-size:13px}
.m-foot a{color:#fff;font-weight:600}
@media (max-width:600px){
  .m-top{flex-direction:column;align-items:flex-start;padding:22px 20px 10px;min-height:0}
  .m-poster{width:120px}
  .m-body{padding:4px 20px 22px}
  .hero{min-height:auto}
  .hero-inner{flex-direction:column;align-items:flex-start}
  .hero-poster{width:130px}
}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;background:#fff;color:#000;font-weight:600;font-size:14px;padding:10px 18px;border-radius:999px;z-index:80;transition:all .3s;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.loading{padding:180px var(--pad);text-align:center;color:var(--muted)}
footer{padding:20px var(--pad);color:var(--dim);font-size:12px;line-height:1.6}
footer a{color:var(--muted)}
</style>
</head>
<body>
<header id="hdr">
  <div class="logo" id="logo" title="Til forsiden">FILM<span>LISTE</span></div>
  <nav class="tabs" id="tabs" aria-label="Streamingtjenester"></nav>
  <label class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Søg film…" autocomplete="off">
  </label>
</header>

<main id="app"><div class="loading">Henter dine film…</div></main>
<footer id="foot"></footer>

<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

var LIST_URLS=[
  "https://raw.githubusercontent.com/Kappa1243/spisekort/main/film/films.json",
  "films.json"
];
var CACHE_KEY="filmliste.cache.v2";
/* Appens version. Når index.html ændres, hæves tallet her OG "app" i films.json,
   så telefoner med en gammel, gemt udgave af siden selv henter den nye. */
var APP_VERSION=4;

/* Danske tjenester: farve */
var SERVICES={
  "Netflix":"#e50914","HBO Max":"#5b2ee0","Disney+":"#1336c9","Viaplay":"#ff1f5a","TV 2 Play":"#d81f26","DRTV":"#a3122a",
  "Prime Video":"#00a8e1","SkyShowtime":"#2b2fa8","Apple TV+":"#6b7280","Nordisk Film+":"#1f3b73","Allente":"#f26a21",
  "Paramount+":"#0064ff","MUBI":"#3a3a3a","Filmstriben":"#00897b",
  "Apple TV":"#6b7280","Amazon Video":"#0f79af","Rakuten TV":"#bf0000","SF Anytime":"#c4161c","Google Play":"#34a853","Blockbuster":"#1d4ed8"
};
var ALIASES={"disney plus":"Disney+","amazon prime video":"Prime Video","prime":"Prime Video","hbo":"HBO Max","max":"HBO Max",
  "tv2 play":"TV 2 Play","tv 2":"TV 2 Play","dr tv":"DRTV","dr":"DRTV","apple tv store":"Apple TV","itunes":"Apple TV","paramount plus":"Paramount+"};
var GRADS=[["#7f1d1d","#1c1917"],["#1e3a8a","#0f172a"],["#065f46","#022c22"],["#581c87","#1e1b4b"],["#9a3412","#1c1917"],["#155e75","#082f49"],["#3f3f46","#09090b"]];

function svcName(s){var k=String(s||"").trim();return ALIASES[k.toLowerCase()]||k}
function svcColor(s){return SERVICES[s]||"#71717a"}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function readJSON(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function fmtTime(m){if(!m)return"";var h=Math.floor(m/60),r=m%60;return h?(h+" t "+(r?r+" min":"")).trim():r+" min"}
function fmtDate(d){if(!d)return"";var p=String(d).split("-");var mo=["jan.","feb.","mar.","apr.","maj","jun.","jul.","aug.","sep.","okt.","nov.","dec."];return p.length===3?(+p[2])+". "+mo[+p[1]-1]+" "+p[0]:d}
function kr(n){return (Math.round(n*100)/100).toLocaleString("da-DK")+" kr."}

var films=[],updated="",filter=null,query="",genre=null;

function clean(list){
  var seen={},out=[];
  (list||[]).forEach(function(f){
    if(!f||!f.title)return;
    var id=f.id||f.title.toLowerCase().replace(/[^a-z0-9æøå]+/g,"-");
    if(seen[id])return;seen[id]=1;
    var uniq=function(a){var s={},o=[];(a||[]).forEach(function(x){x=svcName(x);if(x&&!s[x]){s[x]=1;o.push(x)}});return o};
    var rent=[],rs={};
    (f.rent||[]).forEach(function(r){
      var o=typeof r==="string"?{service:svcName(r),price:null}:{service:svcName(r.service||r.s),price:(r.price!=null&&r.price!=="")?+r.price:null};
      if(!o.service||rs[o.service])return;rs[o.service]=1;rent.push(o);
    });
    rent.sort(function(a,b){return (a.price==null?1e9:a.price)-(b.price==null?1e9:b.price)||a.service.localeCompare(b.service,"da")});
    out.push({id:id,title:f.title,danishTitle:f.danishTitle||"",originalTitle:f.originalTitle||"",year:f.year||"",runtime:f.runtime||0,
      genres:(f.genres||[]).slice(),note:f.note||"",poster:f.poster||"",wiki:f.wiki||"",justwatch:f.justwatch||"",
      stream:uniq(f.stream).concat(uniq(f.free)).filter(function(x,i,a){return a.indexOf(x)===i}),rent:rent,checked:f.checked||"",added:f.added||""});
  });
  return out;
}
function displayTitle(f){return f.danishTitle||f.title}
function cheapest(f){var p=f.rent.filter(function(r){return r.price!=null});return p.length?p[0].price:null}
function rentOnly(f){return !f.stream.length&&f.rent.length>0}
function nowhere(f){return !f.stream.length&&!f.rent.length}
function byTitle(a,b){return displayTitle(a).localeCompare(displayTitle(b),"da")}
function byPrice(a,b){var x=cheapest(a),y=cheapest(b);return (x==null?1e9:x)-(y==null?1e9:y)||byTitle(a,b)}
function allSvc(){var c={};films.forEach(function(f){f.stream.forEach(function(s){c[s]=(c[s]||0)+1})});
  return Object.keys(c).sort(function(a,b){return c[b]-c[a]||a.localeCompare(b,"da")}).map(function(s){return{name:s,n:c[s]}})}
function allGenres(){var c={};films.forEach(function(f){f.genres.forEach(function(g){c[g]=(c[g]||0)+1})});
  return Object.keys(c).sort(function(a,b){return c[b]-c[a]||a.localeCompare(b,"da")}).map(function(g){return{name:g,n:c[g]}})}

/* ---------- plakater ---------- */
var wikiCache=readJSON("filmliste.wiki.v1",{});
function wikiThumb(title){
  if(!title)return Promise.reject();
  if(wikiCache[title])return Promise.resolve(wikiCache[title]);
  return fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title.replace(/ /g,"_"))).then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(d){var u=(d.originalimage&&d.originalimage.source)||(d.thumbnail&&d.thumbnail.source);if(!u)throw 0;wikiCache[title]=u;writeJSON("filmliste.wiki.v1",wikiCache);return u});
}
function posterSrc(f,size){return f.poster?f.poster.replace(/\/s\d+\//,"/"+(size||"s332")+"/"):""}
function posterHTML(f,opts){
  opts=opts||{};
  var g=GRADS[hash(f.id)%GRADS.length],svc="";
  if(opts.badges){
    var k=window.innerWidth<600?1:2;
    if(f.stream.length)svc=f.stream.slice(0,k).map(function(s){return '<span style="--c:'+svcColor(s)+'">'+esc(s)+'</span>'}).join("")+(f.stream.length>k?'<span class="more">+'+(f.stream.length-k)+'</span>':"");
    else if(f.rent.length)svc='<span class="rent">Leje</span>';
    if(svc)svc='<div class="svc">'+svc+'</div>';
  }
  return '<div class="poster"><div class="fallback" style="--g1:'+g[0]+';--g2:'+g[1]+'"><b>'+esc(displayTitle(f))+'</b><small>'+esc(f.year)+'</small></div>'+
    '<img alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-id="'+esc(f.id)+'" data-size="'+(opts.size||"s332")+'">'+svc+'</div>';
}
function hydratePosters(root){
  root.querySelectorAll("img[data-id]:not([data-h])").forEach(function(img){
    img.setAttribute("data-h","1");
    var f=films.find(function(x){return x.id===img.getAttribute("data-id")});if(!f)return;
    var step=0;
    function next(){
      step++;
      if(step===1&&f.poster){img.src=posterSrc(f,img.getAttribute("data-size"));return}
      if(step<=2&&f.wiki){step=2;wikiThumb(f.wiki).then(function(u){img.src=u}).catch(function(){img.remove()});return}
      img.remove();
    }
    img.onload=function(){img.classList.add("ok")};
    img.onerror=next;next();
  });
}
function bgFor(el,f){
  if(!el)return;
  var src=posterSrc(f,"s592"),t=new Image();t.referrerPolicy="no-referrer";
  t.onload=function(){el.style.backgroundImage="url('"+src+"')"};
  t.onerror=function(){wikiThumb(f.wiki).then(function(u){el.style.backgroundImage="url('"+u+"')"}).catch(function(){})};
  if(src)t.src=src;else t.onerror();
}

/* ---------- komponenter ---------- */
function cardHTML(f){
  var sub,p=cheapest(f);
  if(rentOnly(f))sub='<div class="price">'+(p!=null?"Lej fra "+kr(p):"Kan lejes")+'</div>';
  else sub='<div class="y">'+esc([f.year,f.genres[0]].filter(Boolean).join(" · "))+'</div>';
  return '<button class="card" data-open="'+esc(f.id)+'" aria-label="'+esc(displayTitle(f))+'">'+posterHTML(f,{badges:true})+
    '<div class="t">'+esc(displayTitle(f))+'</div>'+sub+'</button>';
}
function badge(s){return '<span class="badge" style="--c:'+svcColor(s)+'"><i></i>'+esc(s)+'</span>'}
function rowHTML(title,list,opts){
  if(!list.length)return"";
  opts=opts||{};
  return '<section class="row"><div class="row-head"><h2>'+(opts.color?'<i style="--c:'+opts.color+'"></i>':"")+esc(title)+'</h2><span class="count">'+list.length+' film</span>'+
    (opts.go&&list.length>3?'<button class="more" data-go="'+esc(opts.go)+'">Se alle ›</button>':"")+'</div>'+
    '<div class="track-wrap"><button class="arrow l" aria-label="Tilbage">‹</button><div class="track">'+list.map(cardHTML).join("")+'</div><button class="arrow r" aria-label="Frem">›</button></div></section>';
}
function renderTabs(){
  var t='<button class="tab'+(!filter?" on":"")+'" data-filter="">Alle</button>'+
    allSvc().map(function(s){return '<button class="tab'+(filter==="svc:"+s.name?" on":"")+'" data-filter="svc:'+esc(s.name)+'"><i style="--c:'+svcColor(s.name)+'"></i>'+esc(s.name)+'</button>'}).join("");
  var nav=document.getElementById("tabs");nav.innerHTML=t;
  var on=nav.querySelector(".tab.on");if(on&&filter)nav.scrollLeft=on.offsetLeft-nav.clientWidth/2+on.clientWidth/2;
}

/* ---------- visninger ---------- */
function inGenre(f){return !genre||f.genres.indexOf(genre)>-1}
function mainGenre(f){return f.genres[0]||"Andet"}
function pickHero(){
  var pool=films.filter(function(f){return f.stream.length&&inGenre(f)});
  if(!pool.length)pool=films.filter(inGenre);if(!pool.length)pool=films;
  return pool[Math.floor(Date.now()/864e5)%pool.length];
}
function heroHTML(f){
  var p=cheapest(f);
  return '<section class="hero"><div class="hero-bg" id="heroBg"></div><div class="hero-inner">'+
    '<div class="hero-poster">'+posterHTML(f,{size:"s592"})+'</div>'+
    '<div class="hero-text"><div class="kicker">'+(genre?esc(genre)+" fra din liste":"Fra din liste")+'</div>'+
    '<h1>'+esc(displayTitle(f))+'</h1>'+
    '<div class="meta">'+[f.year,fmtTime(f.runtime),f.genres.slice(0,3).join(", ")].filter(Boolean).map(esc).join('<span class="dot"></span>')+'</div>'+
    (f.note?'<p class="note">'+esc(f.note)+'</p>':"")+
    '<div class="hero-actions">'+(f.stream.length?'<div class="badges">'+f.stream.map(badge).join("")+'</div>':(f.rent.length?'<span class="badge rent"><i style="--c:var(--rent)"></i>'+(p!=null?"Lej fra "+kr(p):"Kan lejes")+'</span>':""))+
    '<button class="btn ghost" data-open="'+esc(f.id)+'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/></svg>Mere info</button></div>'+
    '</div></div></section>';
}
/* genre-filter: tæller kun film i den aktuelle visning (fx kun Netflix) */
function genreBarHTML(base){
  var c={};base.forEach(function(f){f.genres.forEach(function(g){c[g]=(c[g]||0)+1})});
  var gs=Object.keys(c).sort(function(a,b){return c[b]-c[a]||a.localeCompare(b,"da")});
  if(genre&&gs.indexOf(genre)<0)gs.unshift(genre);
  if(gs.length<2&&!genre)return"";
  return '<div class="genrebar"><div class="chips"><span class="lbl">Genre</span><button class="chip'+(!genre?" on":"")+'" data-genre="">Alle</button>'+
    gs.map(function(g){return '<button class="chip'+(genre===g?" on":"")+'" data-genre="'+esc(g)+'">'+esc(g)+' <span class="n">'+(c[g]||0)+'</span></button>'}).join("")+'</div></div>';
}
/* rækker pr. hovedgenre (første genre), så hver film kun står ét sted */
function genreRows(list,sort){
  var groups={};list.forEach(function(f){var g=mainGenre(f);(groups[g]=groups[g]||[]).push(f)});
  return Object.keys(groups).sort(function(a,b){return groups[b].length-groups[a].length||a.localeCompare(b,"da")})
    .map(function(g){return rowHTML(g,groups[g].sort(sort||byTitle),{go:"g:"+g})}).join("");
}
function homeHTML(){
  var h="",list=films.filter(inGenre);
  if(!genre){
    var recent=films.filter(function(f){return f.added}).sort(function(a,b){return b.added.localeCompare(a.added)}).slice(0,12);
    if(recent.length>=3)h+=rowHTML("Senest tilføjet",recent);
  }
  allSvc().forEach(function(s){h+=rowHTML("På "+s.name,list.filter(function(f){return f.stream.indexOf(s.name)>-1}).sort(byTitle),{color:svcColor(s.name),go:"svc:"+s.name})});
  h+=rowHTML("Til leje – billigste først",list.filter(rentOnly).sort(byPrice),{color:"var(--rent)",go:"rent"});
  h+=rowHTML("Ikke tilgængelig i Danmark lige nu",list.filter(nowhere).sort(byTitle),{color:"#52525b",go:"none"});
  return h||'<div class="empty">Ingen film i genren <b>'+esc(genre)+'</b>.</div>';
}
function baseList(){
  var list=films.slice();
  if(filter==="rent")list=list.filter(rentOnly);
  else if(filter==="none")list=list.filter(nowhere);
  else if(filter&&filter.indexOf("svc:")===0){var s=filter.slice(4);list=list.filter(function(f){return f.stream.indexOf(s)>-1})}
  if(query){
    var q=query.toLowerCase();
    list=list.filter(function(f){return [f.title,f.danishTitle,f.originalTitle,f.year,f.genres.join(" "),f.stream.join(" "),f.note].join(" ").toLowerCase().indexOf(q)>-1});
  }
  return list;
}
function filtered(){return baseList().filter(inGenre).sort(filter==="rent"?byPrice:byTitle)}
function filterLabel(){
  if(filter==="rent")return{t:"Til leje – billigste først",c:"var(--rent)"};
  if(filter==="none")return{t:"Ikke tilgængelig i Danmark",c:"#52525b"};
  if(filter&&filter.indexOf("svc:")===0)return{t:filter.slice(4),c:svcColor(filter.slice(4))};
  if(query)return{t:"Søgning: “"+query+"”"};
  return{t:"Alle film"};
}
function render(){
  renderTabs();
  var app=document.getElementById("app");
  if(!films.length){
    app.innerHTML='<div class="empty" style="padding-top:160px"><b>Din filmliste er tom.</b><br>Skriv til Claude, hvilke film du vil have på listen – så finder Claude ud af, hvor de kan streames.</div>';
    return footer();
  }
  if(!filter&&!query){
    var hero=pickHero();
    app.innerHTML=heroHTML(hero)+genreBarHTML(films)+homeHTML();
    bgFor(document.getElementById("heroBg"),hero);
  }else{
    var base=baseList(),list=base.filter(inGenre),lab=filterLabel();
    if(query&&filter)lab.t+=" · “"+query+"”";
    var sort=filter==="rent"?byPrice:byTitle;
    /* en tjeneste uden valgt genre: opdelt i rækker efter genre. Ellers et gitter. */
    var asRows=filter&&filter.indexOf("svc:")===0&&!genre&&!query&&list.length>0;
    app.innerHTML='<div class="grid-wrap"><div class="grid-title"><h2>'+(lab.c?'<i style="--c:'+lab.c+'"></i>':"")+esc(lab.t)+'</h2><span class="count">'+list.length+' film'+(genre?" · "+esc(genre):"")+'</span></div></div>'+
      genreBarHTML(base)+
      (asRows?'<div class="rows">'+genreRows(list,sort)+'</div>':
        '<div class="grid-wrap" style="padding-top:6px">'+(list.length?'<div class="grid">'+list.sort(sort).map(cardHTML).join("")+'</div>':'<div class="empty">Ingen film matcher'+(query?' “<b>'+esc(query)+'</b>”':"")+(genre?' i genren <b>'+esc(genre)+'</b>':"")+'.</div>')+'</div>');
  }
  hydratePosters(app);
  app.querySelectorAll(".track-wrap").forEach(function(w){
    var t=w.querySelector(".track");
    w.querySelector(".arrow.l").onclick=function(){t.scrollBy({left:-t.clientWidth*.85,behavior:"smooth"})};
    w.querySelector(".arrow.r").onclick=function(){t.scrollBy({left:t.clientWidth*.85,behavior:"smooth"})};
  });
  var on=app.querySelector(".genrebar .chip.on");if(on&&genre){var c=on.parentNode;c.scrollLeft=on.offsetLeft-c.clientWidth/2+on.clientWidth/2}
  footer();
}
function footer(){
  document.getElementById("foot").innerHTML=films.length?'Udbud og lejepriser gælder Danmark og er tjekket via <a href="https://www.justwatch.com/dk" target="_blank" rel="noopener">JustWatch</a>'+(updated?' – listen er sidst opdateret '+esc(fmtDate(updated)):"")+'. Tryk på en film for at se dato for sidste tjek.':"";
}

/* ---------- detaljer ---------- */
function openFilm(id){
  var f=films.find(function(x){return x.id===id});if(!f)return;
  var sub=[];
  if(f.danishTitle&&f.danishTitle!==f.title)sub.push(f.title);
  if(f.originalTitle)sub.push(f.originalTitle);
  var best=cheapest(f);
  var stream='<div class="offer"><h3>Stream</h3>'+(f.stream.length?'<div class="badges">'+f.stream.map(badge).join("")+'</div>':'<div class="none">Ikke på nogen dansk streamingtjeneste lige nu'+(f.rent.length?" – men den kan lejes.":".")+'</div>')+'</div>';
  var rent=f.rent.length?'<div class="offer"><h3>Lej</h3><div class="prices">'+f.rent.map(function(r,i){
      var isBest=best!=null&&r.price===best;
      return '<div class="'+(isBest?"best":"")+'" style="--c:'+svcColor(r.service)+'"><i></i>'+esc(r.service)+(isBest&&i===0?' <small>Billigst</small>':"")+'<b>'+(r.price!=null?kr(r.price):"–")+'</b></div>';
    }).join("")+'</div></div>':"";
  var m=document.getElementById("modal");
  m.innerHTML='<button class="close" id="mClose" aria-label="Luk">✕</button>'+
    '<div class="m-top"><div class="bg" id="mBg"></div><div class="m-poster">'+posterHTML(f,{size:"s592"})+'</div>'+
    '<div class="m-title"><h2>'+esc(displayTitle(f))+'</h2>'+(sub.length?'<div class="orig">'+esc(sub.join(" · "))+'</div>':"")+
    '<div class="meta">'+[f.year,fmtTime(f.runtime)].filter(Boolean).map(esc).join('<span class="dot"></span>')+'</div>'+
    '<div class="tags">'+f.genres.map(function(g){return '<button class="tag" data-genre="'+esc(g)+'">'+esc(g)+'</button>'}).join("")+'</div></div></div>'+
    '<div class="m-body">'+(f.note?'<p>'+esc(f.note)+'</p>':"")+stream+rent+
    '<div class="m-foot"><span>'+(f.checked?"Tjekket "+esc(fmtDate(f.checked)):"")+'</span>'+
    (f.justwatch?'<a href="'+esc(f.justwatch)+'" target="_blank" rel="noopener">Se seneste udbud på JustWatch ↗</a>':"")+'</div></div>';
  document.getElementById("overlay").classList.add("open");
  document.body.style.overflow="hidden";
  hydratePosters(m);
  bgFor(document.getElementById("mBg"),f);
  document.getElementById("mClose").onclick=closeModal;
  try{history.replaceState(null,"","#"+f.id)}catch(e){}
}
function closeModal(){
  document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow="";
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var o=e.target.closest("[data-open]");if(o){openFilm(o.getAttribute("data-open"));return}
  var fl=e.target.closest("[data-filter]");if(fl){filter=fl.getAttribute("data-filter")||null;render();window.scrollTo({top:0});return}
  var gn=e.target.closest("[data-genre]");if(gn){var inModal=!!e.target.closest("#modal");genre=gn.getAttribute("data-genre")||null;if(inModal){closeModal();if(filter==="rent"||filter==="none")filter=null}var y=inModal?0:window.scrollY;render();window.scrollTo({top:y});return}
  var g=e.target.closest("[data-go]");if(g){var v=g.getAttribute("data-go");if(v.indexOf("g:")===0){genre=v.slice(2)}else{filter=v}closeModal();render();window.scrollTo({top:0});return}
});
document.getElementById("overlay").addEventListener("click",function(e){if(e.target.id==="overlay")closeModal()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});
document.getElementById("logo").onclick=function(){filter=null;query="";genre=null;document.getElementById("q").value="";render();window.scrollTo({top:0,behavior:"smooth"})};
var qt;document.getElementById("q").addEventListener("input",function(e){clearTimeout(qt);qt=setTimeout(function(){query=e.target.value.trim();render();window.scrollTo({top:0})},120)});
window.addEventListener("scroll",function(){document.getElementById("hdr").classList.toggle("solid",window.scrollY>40)},{passive:true});
function toast(t){var el=document.getElementById("toast");el.textContent=t;el.classList.add("show");setTimeout(function(){el.classList.remove("show")},2600)}

/* ---------- data ---------- */
function sameData(a,b){try{return JSON.stringify(a)===JSON.stringify(b)}catch(e){return false}}
function setData(d,announce){
  var before={};films.forEach(function(f){before[f.id]=1});
  films=clean(Array.isArray(d)?d:(d&&d.films));updated=(d&&d.updated)||"";
  if(filter&&!query&&baseList().length===0)filter=null;
  render();
  var added=films.filter(function(f){return !before[f.id]}).length;
  if(announce&&added)toast(added+(added===1?" ny film":" nye film")+" på din liste");
  var h=decodeURIComponent(location.hash.slice(1));
  if(h&&!document.getElementById("overlay").classList.contains("open")&&films.some(function(f){return f.id===h}))openFilm(h);
}
function fetchList(i){
  if(i>=LIST_URLS.length)return Promise.reject(new Error("no list"));
  var u=LIST_URLS[i];
  return fetch(u+(u.indexOf("?")>-1?"&":"?")+"t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json()})
    .then(function(d){var l=Array.isArray(d)?d:(d&&d.films);if(!Array.isArray(l))throw new Error("bad");return d}).catch(function(){return fetchList(i+1)});
}
var cached=readJSON(CACHE_KEY,null);
if(cached&&cached.data)setData(cached.data,false);
var lastSync=0;
function sync(){
  if(Date.now()-lastSync<15000)return;lastSync=Date.now();
  fetchList(0).then(function(d){
    if(d&&+d.app>APP_VERSION){
      var k="filmliste.reload."+d.app,tried=false;try{tried=sessionStorage.getItem(k)}catch(e){}
      if(!tried){try{sessionStorage.setItem(k,"1")}catch(e){}location.replace(location.pathname+"?v="+d.app+location.hash);return}
    }
    /* tegn kun siden igen, hvis listen faktisk er ændret – så plakaterne ikke blinker */
    if(cached&&sameData(cached.data,d))return;
    var had=!!cached;cached={at:Date.now(),data:d};writeJSON(CACHE_KEY,cached);setData(d,had);
  }).catch(function(){if(!films.length)document.getElementById("app").innerHTML='<div class="loading">Kunne ikke hente listen. Tjek din forbindelse og prøv igen.</div>'});
}
sync();
document.addEventListener("visibilitychange",function(){if(!document.hidden)sync()});
})();
</script>
</body>
</html>
