<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */

<style>
/* Layout: full-screen map; one sheet (bottom sheet on phone, left card on desktop) that swaps between views. */
:root{
  color-scheme:light;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg)}

button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
#probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

#map{position:fixed;inset:0;background:var(--bg);font-family:var(--body);z-index:0}
body.picking #map{cursor:crosshair}
.leaflet-container{font:inherit}
.leaflet-bottom{bottom:var(--inset-b)}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.8)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-bar{border:0!important;border-radius:12px!important;box-shadow:var(--shadow)!important;overflow:hidden}
.leaflet-bar a{background:var(--solid);color:var(--ink);border-bottom:1px solid var(--line);width:40px;height:40px;line-height:40px}
.leaflet-top{top:env(safe-area-inset-top,0px)}
.pinwrap{background:none;border:0}
.pin{width:16px;height:16px;border-radius:50%;background:var(--ink);border:2.5px solid var(--solid);box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .15s}
.pin.sel{background:var(--accent);transform:scale(1.5)}
.leaflet-tooltip.plabel{background:var(--solid);color:var(--ink);border:0;border-radius:8px;font:600 12px var(--body);box-shadow:var(--shadow);padding:4px 9px}
.leaflet-tooltip.plabel::before{display:none}

.chips{position:fixed;z-index:900;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;gap:8px;overflow-x:auto;padding:2px 12px 10px;scrollbar-width:none;pointer-events:none}
.chips::-webkit-scrollbar{display:none}
.chips[hidden]{display:none}
.chip{pointer-events:auto;flex:0 0 auto;white-space:nowrap;border:0;background:var(--solid);border-radius:999px;padding:0 15px;height:36px;font-size:14px;font-weight:600;box-shadow:var(--shadow)}

.sheet .chips{position:static;padding:0 20px 14px;pointer-events:auto;touch-action:pan-x;gap:6px}
.sheet .chip{background:var(--chip);box-shadow:none;height:34px;padding:0 14px}
.sheet .chip[aria-pressed="true"]{background:var(--ink);color:#fff}

.fabs{position:fixed;z-index:950;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(var(--inset-b) + 12px);display:grid;gap:10px;transition:opacity .2s}

.handle i{display:block;width:38px;height:5px;border-radius:3px;background:#d6dadf}
.vhead{display:none;align-items:center;justify-content:space-between;gap:12px;padding:0 14px 14px 20px;min-height:52px}
.sheet[data-view="list"] .vhead[data-view="list"],
.sheet[data-view="place"] .vhead[data-view="place"],
.sheet[data-view="add"] .vhead[data-view="add"],
.sheet[data-view="start"] .vhead[data-view="start"],
.sheet[data-view="more"] .vhead[data-view="more"]{display:flex}
.vhead > div:first-child{min-width:0}
h1,h2{margin:0;letter-spacing:-.025em;text-wrap:balance}
h1{font:700 24px/1.15 var(--body)}

.sheet[data-view="place"] .view[data-view="place"],

.empty{padding:12px 0 8px;display:grid;gap:14px;justify-items:start}

.btn{min-height:48px;padding:0 18px;border-radius:14px;border:0;background:var(--chip);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}

.err{color:var(--accent);font-size:14px;margin:0 0 12px;min-height:0}

<div class="chips" id="chips" role="group" aria-label="Filtrer efter madtype" hidden></div>

<div class="fabs" id="fabs">
  <button type="button" class="fab" id="fitBtn" aria-label="Vis alle steder" title="Vis alle steder">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button type="button" class="fab" id="locBtn" aria-label="Afstand fra din placering" title="Afstand fra din placering">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21 3 3 10.5l7.2 2.3L12.5 20z"/></svg>
  </button>
</div>

<div class="hint" id="hint" hidden><span id="hintText">Tryk på kortet</span><button type="button" id="hintCancel">Annuller</button></div>

<aside class="sheet" id="sheet" data-view="list" aria-label="Dine restauranter">
  <div class="sheet-top" id="sheetTop">
    <div class="handle" aria-hidden="true"><i></i></div>

    <div class="vhead" data-view="list">
      <div>
        <h1>Spisekort</h1>
        <button type="button" class="from" id="fromBtn"><span id="fromText">Afstand fra <strong>Rådhuspladsen</strong></span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
      </div>
    </div>

    <div class="vhead" data-view="place">
      <div><h2 id="pName"></h2><p class="sub" id="pMeta"></p></div>
      <button type="button" class="icon" data-close aria-label="Luk">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="vhead" data-view="start">
      <div><h2>Afstand fra</h2></div>
      <button type="button" class="icon" data-close aria-label="Luk">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </div>

  <div class="scroll" id="scroll">
    <section class="view" data-view="list"><ol id="list"></ol></section>

    <section class="view" data-view="place">
      <p class="paddr" id="pAddr"></p>
      <div class="pactions">
        <a class="btn primary" id="pRoute" href="#" target="_blank" rel="noopener">Rute</a>
        <button type="button" class="btn" id="pCopy">Kopiér adresse</button>
      </div>
      <p class="pnote" id="pNote" hidden></p>
      <p class="pmeta" id="pApprox" hidden>Positionen på kortet er omtrentlig, indtil siden har slået adressen op.</p>
    </section>

    <section class="view" data-view="start">
      <div class="stack">
        <p class="cur">Lige nu: <strong id="curPos">Rådhuspladsen</strong></p>
        <div>
          <p class="notice" id="gpsNote" hidden></p>
          <button type="button" class="btn full" id="gpsBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21 3 3 10.5l7.2 2.3L12.5 20z"/></svg>Brug min placering</button>
        </div>
        <form class="inrow" id="startForm" novalidate>
          <label for="startAddr" class="sr">Skriv en adresse</label>
          <input id="startAddr" autocomplete="street-address" placeholder="Skriv en adresse" enterkeyhint="search">
          <button type="submit" class="btn primary" id="startGo">Søg</button>
        </form>
        <div class="stack" style="gap:10px">
          <span class="label">Eller vælg et område</span>
          <div class="areas" id="areas"></div>
        </div>
        <div><button type="button" class="textbtn" id="pickStart">Vælg et punkt på kortet</button></div>
      </div>
    </section>

  </div>
</aside>
<div id="toast" role="status" aria-live="polite" hidden></div>

  var d=drag;drag=null;
  var list=snapsFor(view),pxs=list.map(snapPx);
  if(!d.moved){
    if(d.onHandle){
      var i=list.indexOf(snapName);
      snap(list[(i+1)%list.length]);
    }
    return;
  }
  suppressClick=true;setTimeout(function(){suppressClick=false},50);
  var v=d.vy||0,best=0;
  if(v<-0.45){best=pxs.length-1;for(var k=0;k<pxs.length;k++){if(pxs[k]>vis+10){best=k;break}}}
  else if(v>0.45){best=0;for(var j=pxs.length-1;j>=0;j--){if(pxs[j]<vis-10){best=j;break}}}
  else{var dmin=1e9;pxs.forEach(function(p,k){if(Math.abs(p-vis)<dmin){dmin=Math.abs(p-vis);best=k}})}
  snap(list[best]);
}

var OSM_ATTR='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';

var stage=0,tileOk=0,tileErr=0,tiles=null;
map.attributionControl.setPrefix(false);
function tileUrl(){
  if(stage>=2)return 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
  return 'https://basemaps.cartocdn.com/rastertiles/'+(stage===0?'light_all':'voyager')+'/{z}/{x}/{y}.png?key='+CARTO_KEY;
}
function addTiles(){
  if(tiles)map.removeLayer(tiles);
  tileOk=0;tileErr=0;
  var mine=L.tileLayer(tileUrl(),{maxZoom:stage>=2?19:20,attribution:stage>=2?OSM_ATTR:CARTO_ATTR}).addTo(map);
  tiles=mine;
  mine.on('tileload',function(){if(mine===tiles)tileOk++});
  mine.on('tileerror',function(){
    if(mine!==tiles)return;
    tileErr++;
    if(tileOk===0&&tileErr>=4&&stage<2){stage++;addTiles()}
  });
}

    document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);var ok=document.execCommand('copy');ta.remove();return ok;

/* ---------- web lookups (OpenStreetMap Nominatim) ---------- */
function fetchJson(url){
  var ctl=window.AbortController?new AbortController():null,t=setTimeout(function(){if(ctl)ctl.abort()},8000);
  return fetch(url,{signal:ctl?ctl.signal:undefined,headers:{'Accept':'application/json'}}).then(function(r){
    clearTimeout(t);if(!r.ok)throw new Error('http '+r.status);return r.json();
  },function(e){clearTimeout(t);throw e});
}
function geocode(q){
  return fetchJson('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=dk&accept-language=da&q='+encodeURIComponent(q)).then(function(a){
    if(!a||!a.length)return null;
    var lat=parseFloat(a[0].lat),lon=parseFloat(a[0].lon);
    return isFinite(lat)&&isFinite(lon)?{lat:lat,lon:lon}:null;
  });
}
function reverseGeocode(lat,lon){
  return fetchJson('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=da&lat='+lat+'&lon='+lon).then(function(d){
    var a=d&&d.address;if(!a)return '';
    var road=a.road||a.pedestrian||a.footway||a.square||'',num=a.house_number||'';
    var city=a.city||a.town||a.village||a.suburb||a.municipality||'',pc=a.postcode||'';
    return [(road+' '+num).trim(),(pc+' '+city).trim()].filter(Boolean).join(', ');
  });
}

function readJSON(k,def){try{var v=JSON.parse(localStorage.getItem(k)||'null');return v==null?def:v}catch(e){return def}}
function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var geoCache=readJSON(GEO_KEY,{});
function geoKey(p){return (p.address||'').toLowerCase().replace(/\s+/g,' ').trim()}
function clean(list){
  var out=[],seen={};
  (list||[]).forEach(function(s){
    if(!s||!s.id||!s.name||s.removed||seen[s.id])return;seen[s.id]=1;
    var lat=typeof s.lat==='number'&&isFinite(s.lat)?s.lat:null,lon=typeof s.lon==='number'&&isFinite(s.lon)?s.lon:null;
    var p={id:String(s.id),name:String(s.name),type:cap(String(s.type||'')),address:String(s.address||''),note:String(s.note||''),lat:lat,lon:lon,approx:s.approx!==false||lat==null,michelin:typeof s.michelin==='number'&&s.michelin>=0?Math.min(3,Math.floor(s.michelin)):null};
    var g=geoCache[geoKey(p)];
    if(g&&p.approx){p.lat=g.lat;p.lon=g.lon;p.approx=false}
    out.push(p);
  });
  return out;
}
function setPlaces(list,announce){
  var before={};places.forEach(function(p){before[p.id]=1});
  places=clean(list);loaded=true;
  if(selected&&!byId(selected)){selected=null;if(view==='place')setView('list','mid')}
  if(filter!=='Alle'&&!places.some(function(p){return p.type===filter}))filter='Alle';
  refresh();placeChips();
  var added=places.filter(function(p){return !before[p.id]}).length;
  if(announce&&added){toast(added+(added===1?' nyt sted':' nye steder')+' på din liste');fitView()}
  setTimeout(refinePositions,1200);
}
function fetchList(i){
  if(i>=LIST_URLS.length)return Promise.reject(new Error('no list'));
  var u=LIST_URLS[i];
  return fetch(u+(u.indexOf('?')>-1?'&':'?')+'t='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('http '+r.status);return r.json();
  }).then(function(d){
    var list=Array.isArray(d)?d:(d&&d.places);
    if(!Array.isArray(list))throw new Error('bad list');
    return list;
  }).catch(function(){return fetchList(i+1)});
}
function syncList(){
  if(location.protocol==='file:'||Date.now()-lastSync<15000)return;
  lastSync=Date.now();
  fetchList(0).then(function(list){
    var hadCache=!!readJSON(CACHE_KEY,null);
    writeJSON(CACHE_KEY,{fetchedAt:Date.now(),places:list});
    setPlaces(list,hadCache);
  },function(){if(!loaded){loaded=true;refresh()}});
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')syncList()});
window.addEventListener('pageshow',function(e){if(e.persisted)syncList()});
function refinePositions(){
  var todo=places.filter(function(p){return p.address&&p.approx}).map(function(p){return p.id});
  var i=0,changed=0;
  function next(){
    if(i>=todo.length){if(changed)refresh();return}
    var p=byId(todo[i++]);
    if(!p||!p.approx){next();return}
    var q=/k[øo]benhavn|frederiksberg|\d{4}/i.test(p.address)?p.address:p.address+', København';
    geocode(q).then(function(c){
      if(c&&(!hasPos(p)||hav(p.lat,p.lon,c.lat,c.lon)<3000)){
        p.lat=c.lat;p.lon=c.lon;p.approx=false;changed++;
        geoCache[geoKey(p)]={lat:c.lat,lon:c.lon};writeJSON(GEO_KEY,geoCache);
      }
    },function(){}).then(function(){
      if(changed&&changed%3===0)refresh();
      setTimeout(next,1100);
    });
  }
  next();
}

/* ---------- start ---------- */
(function(){
  var c=readJSON(CACHE_KEY,null);
  if(c&&Array.isArray(c.places)){setPlaces(c.places,false)}
  else if(location.protocol==='file:'){setPlaces(FALLBACK,false)}
  else{refresh()}
})();
placeChips();
applySheet(isMobile()?snapPx('mid'):0,false);
fitView(false);
(function(){
  if(insecure||!navigator.permissions||!navigator.permissions.query)return;
  navigator.permissions.query({name:'geolocation'}).then(function(s){if(s.state==='granted')locate(false)},function(){});
})();
syncList();
try{localStorage.removeItem('spisekort-places-v1');localStorage.removeItem('spisekort-seed-v1')}catch(e){}
window.__spisekort={snap:snap,state:function(){return {view:view,snap:snapName,vis:vis,count:places.length}}};
})();
