name: Fiskekort data

# Bygger de statiske kortlag (kyst, fredningsbælter, vandkvalitet) i fiskekort/data.
# Køres automatisk, når pipelinen ændres, og kan startes manuelt under Actions.
on:
  workflow_dispatch:
  push:
    paths:
      - "fiskekort/pipeline/**"
      - ".github/workflows/fiskekort-data.yml"
  schedule:
    - cron: "17 3 1 * *" # 1. i hver måned: hent nye fredningsbælter/kystlinje

permissions:
  contents: write

concurrency:
  group: fiskekort-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fiskekort/pipeline/requirements.txt

      - name: Cache kildedata
        uses: actions/cache@v4
        with:
          path: ~/.cache/fiskekort
          key: fiskekort-src-${{ github.run_id }}
          restore-keys: fiskekort-src-

      - run: pip install -r fiskekort/pipeline/requirements.txt

      - name: Byg data
        id: build
        run: python -u fiskekort/pipeline/build.py --out fiskekort/data --cache ~/.cache/fiskekort

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fiskekort/data
          if git diff --cached --quiet; then echo "Ingen ændringer"; exit 0; fi
          git commit -m "Fiskekort: opdater kortdata"
          git pull --rebase --autostash || true
          git push
